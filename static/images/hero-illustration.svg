<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 500" role="img" aria-label="Neural network analysing student placement data">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset=".55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="10" y="10" width="600" height="480" rx="36" fill="url(#bg)"/>
  <circle cx="470" cy="100" r="150" fill="url(#glow)"/>
  <circle cx="120" cy="410" r="120" fill="url(#glow)" opacity=".6"/>

  <!-- Student profile card -->
  <g filter="url(#shadow)">
    <rect x="44" y="72" width="170" height="120" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".22"/>
    <circle cx="78" cy="108" r="18" fill="#dbeafe"/>
    <path d="M78 98a10 10 0 1 0 0 20 10 10 0 0 0 0-20M62 130a16 16 0 0 1 32 0" fill="#2563eb"/>
    <rect x="108" y="98" width="82" height="8" rx="4" fill="#ffffff" opacity=".85"/>
    <rect x="108" y="114" width="58" height="6" rx="3" fill="#bfdbfe" opacity=".8"/>
    <rect x="62" y="148" width="126" height="7" rx="3.5" fill="#ffffff" opacity=".35"/>
    <rect x="62" y="164" width="92" height="7" rx="3.5" fill="#ffffff" opacity=".2"/>
  </g>

  <!-- Input feature chips -->
  <g font-family="Inter, Segoe UI, sans-serif" font-size="12" font-weight="600" fill="#e0f2fe">
    <rect x="42" y="218" width="92" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="88" y="237" text-anchor="middle">CGPA</text>

    <rect x="146" y="218" width="112" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="202" y="237" text-anchor="middle">Skills</text>

    <rect x="42" y="258" width="112" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="98" y="277" text-anchor="middle">Internships</text>

    <rect x="166" y="258" width="92" height="30" rx="15" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".2"/>
    <text x="212" y="277" text-anchor="middle">Projects</text>
  </g>

  <!-- Neural network connections -->
  <g stroke="#93c5fd" stroke-opacity=".45" stroke-width="2">
    <path d="M292 150L390 110M292 150L390 250M292 220L390 110M292 220L390 250M292 290L390 110M292 290L390 250"/>
    <path d="M426 110L520 180M426 250L520 180"/>
  </g>

  <!-- Input layer -->
  <g>
    <circle cx="292" cy="150" r="15" fill="url(#node)"/>
    <circle cx="292" cy="220" r="15" fill="url(#node)"/>
    <circle cx="292" cy="290" r="15" fill="url(#node)"/>
    <text x="292" y="336" text-anchor="middle" fill="#bfdbfe" font-family="Inter, sans-serif" font-size="12">Inputs</text>
  </g>

  <!-- Hidden layer -->
  <g>
    <circle cx="390" cy="110" r="18" fill="#22d3ee"/>
    <circle cx="390" cy="180" r="18" fill="#38bdf8"/>
    <circle cx="390" cy="250" r="18" fill="#60a5fa"/>
    <text x="390" y="300" text-anchor="middle" fill="#bfdbfe" font-family="Inter, sans-serif" font-size="12">Hidden layers</text>
  </g>

  <!-- Output -->
  <g filter="url(#shadow)">
    <circle cx="520" cy="180" r="34" fill="#ffffff"/>
    <circle cx="520" cy="180" r="26" fill="#10b981" fill-opacity=".16"/>
    <path d="M508 181l9 9 17-20" fill="none" stroke="#059669" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="520" y="242" text-anchor="middle" fill="#d1fae5" font-family="Inter, sans-serif" font-size="13" font-weight="700">Placed</text>

  <!-- Probability meter -->
  <g filter="url(#shadow)">
    <rect x="330" y="370" width="230" height="70" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".22"/>
    <text x="352" y="398" fill="#ffffff" font-family="Inter, sans-serif" font-size="12" font-weight="600">Placement probability</text>
    <rect x="352" y="412" width="150" height="9" rx="4.5" fill="#ffffff" fill-opacity=".2"/>
    <rect x="352" y="412" width="106" height="9" rx="4.5" fill="#34d399"/>
    <text x="538" y="421" text-anchor="end" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="12" font-weight="800">71%</text>
  </g>

  <!-- Decorative dots -->
  <g fill="#ffffff" opacity=".22">
    <circle cx="570" cy="70" r="3"/>
    <circle cx="590" cy="92" r="2"/>
    <circle cx="28" cy="360" r="3"/>
    <circle cx="54" cy="390" r="2"/>
    <circle cx="580" cy="330" r="3"/>
  </g>
</svg>
